name: Federated infra smoke test (vantage6)

# Manual-only for now: this spins up a real local vantage6 server + 2 nodes
# via the v6-infrastructure-sh harness and submits real tasks, which is slow
# and network-heavy compared to ci.yml's direct `docker run` smoke tests.
# Run it on demand (Actions tab -> Run workflow) once you want the deeper
# "does this actually work through a vantage6 node" signal; see
# tests/infra/README.md for what it checks and why it isn't wired into
# every push/PR yet.
on:
  workflow_dispatch:

env:
  # Pinned per v6-infrastructure-sh's own guardrail ("Always pin infra by
  # commit SHA in CI"). Needs at least 3d81aa7 (waits for the server API before
  # importing users; earlier, only the last org's users could create tasks).
  # Bump deliberately: later commits switch to nodes.<profile>.env files.
  INFRA_SHA: "fcb0f2bf5782a1528df0cefa7d2ef5e4b8e86c5f"

jobs:
  infra-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout algorithm repo
        uses: actions/checkout@v4

      - name: Checkout infra harness
        uses: actions/checkout@v4
        with:
          repository: mdw-nl/v6-infrastructure-sh
          ref: ${{ env.INFRA_SHA }}
          path: tools/v6-infra

      - name: Build algorithm image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          push: false
          load: true
          tags: datavalgen-model-beach:ci

      - name: Inject repo test config
        run: |
          set -euo pipefail
          sed "s#__REPO_ROOT__#${GITHUB_WORKSPACE}#g" tests/infra/nodes.env > tools/v6-infra/infrastructure/nodes.env
          cp tests/infra/config.env tools/v6-infra/infrastructure/config.env

      - name: Start infra
        run: |
          cd tools/v6-infra/infrastructure
          PYTHON_INTERPRETER=python3.12 ./infra.sh preflight
          PYTHON_INTERPRETER=python3.12 ENVIRONMENT=CI UI_ENABLED=false ./infra.sh up

      - name: Algorithm smoke (submit tasks, check results)
        env:
          V6_ALGO_IMAGE: datavalgen-model-beach:ci
        run: |
          set -o pipefail
          bash tests/infra/run_algo_smoke.sh 2>&1 | tee smoke.log

      - name: Infra smoke
        run: |
          cd tools/v6-infra/infrastructure
          PYTHON_INTERPRETER=python3.12 UI_ENABLED=false ./infra.sh test

      # Job logs need a GitHub login to read; annotations don't. Surfacing the
      # failure here means a failed run can be diagnosed from its summary alone.
      - name: Surface failure details (smoke output, vantage6 container logs)
        if: failure()
        run: |
          annotate() {
            body="$(sed 's/\x1b\[[0-9;]*m//g' | tail -n "$2" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            if [ -n "$body" ]; then echo "::error title=$1::$body"; fi
          }
          [ -f smoke.log ] && annotate "algorithm smoke output" 40 < smoke.log
          for c in $(docker ps -a --format '{{.Names}}' | grep '^vantage6-'); do
            echo "===== $c ====="
            docker logs "$c" 2>&1 | tail -n 300
            docker logs "$c" 2>&1 | grep -E 'WARNING|ERROR|CRITICAL|Traceback|Error|\[Task [0-9]+\]|Starting task|status' | annotate "$c" 60
          done

      - name: Shutdown infra
        if: always()
        run: |
          cd tools/v6-infra/infrastructure
          PYTHON_INTERPRETER=python3.12 ENVIRONMENT=CI UI_ENABLED=false ./infra.sh down
